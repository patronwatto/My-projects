<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main-container">
        <h1>Password Generator</h1>
        <div class="options-container">
            <div class="input-group">
                <input type="text" id="passwod" readonly>
                <i class="far fa-copy" id="copy-btn" title="Copy to clipboard"></i>
            </div>

            <div class="slicer-input">
                <label for="input-slicer">Password Length</label>
                <div class="range-container">
                    <input name="input-slicer" id="input-slicer" type="range" min="6" max="24" value="12" >
                    <span id="range-value">12</span>
                </div>
            </div>

            <div class="checkbox-groups">
                <label for="inclupper">Include Uppercase</label>
                <input id="inclupper" type="checkbox"  checked>
            </div>

            <div class="checkbox-groups">
                <label for="incllower">Include Lowercase</label>
                <input id="incllower" type="checkbox" checked>
            </div>

            <div class="checkbox-groups">
                <label for="inclnum">Include Numbers</label>
                <input id="inclnum" type="checkbox" checked>
            </div>

            <div class="checkbox-groups">
                <label for="inclsym">Include Symbols</label>
                <input id="inclsym" type="checkbox" checked>
            </div>
        </div>

        <button type="submit" id="generate-Btn"><i class="fas fa-key"></i>Generate Password</button>

        <div class="strength-container">
            <p>Password Strength: <span id="strenght-label">Medium</span></p>
            <div class="strength-meter">
                <div class="strength-bar"></div>
            </div>
        </div>
        
    </div>



    <script src="script.js"></script>
</body>
</html>
