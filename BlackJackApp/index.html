<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Jack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-1 hidden">
    <h1 class="main-title">Black Jack👌</h1>
    <h2 class="title-info">You've got Blackjack</h2>
    <card-nums>
        <div class="card-container">
            <h3 class="card-head">Card 1:</h3>
            <P class="card-value" id="card1-value"></P>
        </div>
         <div class="card-container">
            <h3 class="card-head">Card 2:</h3>
            <P class="card-value" id="card2-value"></P>
        </div>
    </card-nums>
    <div class="sums">
        <p class="sum-txt">Sum: </p>
        <h2 class="total" id="total"></h2>
    </div>

    <h2 class="total" id="statement"></h2>
 
    <button id="start-btn">Start Game</button>
    <button id="new-game-btn" class="hidden">Draw Cards</button>

    <h2 id="player-el" class="price"></h2>

    </div>

    <div class="container-2">
    <h1 class="main-title" id="Game-title">Emoji Fighters👌</h1>
    <h2 class="title-info" id="title-info"></h2>
    <card-nums>
        <div class="card-container">
            <!-- <h3 class="card-head">Emoji 1:</h3> -->
            <P class="card-value" id="emoji1-value"></P>
        </div>
        <h3 id="Vs" class="hidden">Vs</h3>
         <div class="card-container">
            <!-- <h3 class="card-head">Card 2:</h3> -->
            <P class="card-value" id="emoji2-value"></P>
        </div>
    </card-nums>
    <div class="sums">
        <!-- <p class="sum-txt">Sum: </p> -->
        <h2 class="total" id="winner"></h2>
    </div>

    <h2 class="total" id="statement1"></h2>
 
    <!-- <button id="start-btn">Start Game</button> -->
    <button id="new-emoji-game-btn" class="">New Game</button>

    <h2 id="player1-el" class="price"></h2>

    </div>

    <script src="script.js"></script>
</body>
</html>
