<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact-Us</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main-container">
        <h1>Get in Touch</h1>
        <p>fill out the form below to contact us</p>

        <form action="" class="contact-form" id="contact-form">
           <div class="form-inputs">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" class="name" id="name" placeholder="Name" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="text" class="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="text" class="phoneNum" id="phoneNum" placeholder="Phone (optional)">
                </div>
                <div class="input-group">
                    <i class="fas fa-tag"></i>
                    <input type="text" class="subject" id="subject" placeholder="Subject">
                </div>
           </div>

            <div class="textarea-group">
                <i class="fas fa-message"></i>
                <textarea class="message" id="message" placeholder="Your message" required></textarea>
            </div>

            <button type="submit" id="send-btn">Send Message <i class="fas fa-paper-plane"></i></button>

        </form>

        <footer>
            <div class="footer-item">
                <i class="fas fa-map-marker-all"></i>
                <p>Bokom_Ndobo-Bonaberi, Douala, Cameroon.</p>
            </div>
            <div class="footer-item">
                <i class="fas fa-envelope"></i>
                <p>patronwatto@gmail.com</p>
            </div>
            <div class="footer-item">
                <i class="fas fa-phone"></i>
                <p>(+237) 677-84-91-84.</p>
            </div>
        </footer>
    </div>


    <script src="script.js"></script>
</body>
</html>
