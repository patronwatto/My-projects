<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color_Pallette</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <h1>Color Pallette Generator</h1>

        <button id="generate-btn"><i class="fas fa-sync-alt"></i>
            Generate Pallette</button>

        <div class="pallette-container">
            <!-- color box  -->
             <div class="color-box">
                <div class="color" style="background-color: #e1f5fe;"></div>
                <div class="color-info">
                    <span class="hex-value">#e1f5fe</span>
                    <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
                </div>
             </div>
             <div class="color-box">
                <div class="color" style="background-color: #b3e5fc;"></div>
                <div class="color-info">
                    <span class="hex-value">#b3e5fc</span>
                    <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
                </div>
             </div>
             <div class="color-box">
                <div class="color" style="background-color: #e1f5fe;"></div>
                <div class="color-info">
                    <span class="hex-value">#e1f5fe</span>
                    <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
                </div>
             </div>
             <div class="color-box">
                <div class="color" style="background-color: #81d4fa;"></div>
                <div class="color-info">
                    <span class="hex-value">#81d4fa</span> 
                    <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
                </div>
             </div>
             <div class="color-box">
                <div class="color" style="background-color: #15ad2f;"></div>
                <div class="color-info">
                    <span class="hex-value">#15ad2f</span>
                    <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
                </div>
             </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
