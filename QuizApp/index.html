<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="container">
    <div class="screen active" id="start-screen">
       <h1>Quiz Time!</h1>
       <p>Test your knowledge with these fun questions</p>
       <button  class="btn" id="start-btn">Start Quiz</button>
    </div>

    <div class="screen " id="quiz-screen"> 
      <div class="quiz-header">
        <h2 class="question-text" id="question-text">Question goes here</h2>
          <div class="quiz-info">
              <p>Question <span id="current-question">1</span> of <span id="total-questions">5</span></p>
              <p>Score: <span id="score">0</span></p>
          </div>

          <div class="answers-container" id="answers-container">
              
         </div>
          <div class="progress-bar">
            <div class="progress" id="progress"></div>
          </div>
      </div>
    </div>

    <div class="screen " id="result-screen">
      <h1>Quiz results</h1>
      <div class="result-info">
        <p>You scored <span id="final-score">0</span> out of <span id="max-score">5</span></p>
        <div id="result-message">Good job!</div>
      </div>
      <button class="btn" id="restart-btn">Restart-Quiz</button>
    </div>
  </div>
    

    <script src="script.js"></script>
</body>
</html>
