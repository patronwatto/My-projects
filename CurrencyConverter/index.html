<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
     integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
     crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
        <div class="currency-container">
            <h1>Currency Converter</h1>
            <form id="converter-form">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" class="amount" name="amount" placeholder="Enter amount..." required>
                </div>

                <div class="form-group">
                    <label for="fro">From</label>
                    <select name="fro" id="fro">
                        <!-- Currency options shall be gotten from out API -->  
                    </select>
                </div>

                <div class="form-group">
                    <label for="to">To</label>
                    <select name="to" id="to">
                        <!-- Currency options shall be gotten from out API -->  
                    </select>
                </div>

                <button type="submit" id="convert-btn">Convert</button>

            </form>

            <div id="results" class="hidden"></div>
        </div>


    
    <script src="script.js"></script>
</body>
</html>
